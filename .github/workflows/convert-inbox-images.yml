name: Convert inbox images

on:
  push:
    paths:
      - 'images/inbox/**'
      - 'tools/convert_inbox_images.py'
      - '.github/workflows/convert-inbox-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif

      - name: Convert inbox images to web JPEG
        run: python tools/convert_inbox_images.py

      - name: Commit converted images
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/converted data/converted-images.json
            git commit -m "Convert inbox images to web JPEG"
            git push
          else
            echo "No converted image changes to commit."
          fi
