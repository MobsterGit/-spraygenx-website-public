<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spray GenX Spacing Check</title>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#061325;color:#fff}.bar{position:sticky;top:0;z-index:10;background:#020914;border-bottom:1px solid rgba(255,255,255,.14);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar strong{font-size:15px}.bar span{color:#d5e4f5;font-size:13px}.bar a,.bar button{border:1px solid rgba(255,255,255,.3);background:#0b65d8;color:#fff;border-radius:4px;padding:9px 12px;font-weight:900;text-decoration:none}.bar button{cursor:pointer}.wrap{height:calc(100vh - 58px);background:#fff}.label{position:absolute;margin:10px;background:rgba(2,9,20,.82);color:#fff;padding:7px 10px;border-radius:4px;font-weight:900;font-size:12px;z-index:2}.frame-wrap{position:relative;height:100%}iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:900px){.wrap{height:82vh}}
</style>
</head>
<body>
<div class="bar"><div><strong>Spacing Check</strong><br><span>Natural spacing is now built into brand.css. The temporary override test has been retired.</span></div><div><a href="index.html">Open Home</a><button id="reloadBtn" type="button">Reload</button></div></div>
<div class="wrap">
  <div class="frame-wrap"><div class="label">Current — Natural spacing default</div><iframe id="siteFrame" src="index.html" title="Current spacing"></iframe></div>
</div>
<script>
document.getElementById('reloadBtn').addEventListener('click',()=>document.getElementById('siteFrame').contentWindow.location.reload());
</script>
</body>
</html>
